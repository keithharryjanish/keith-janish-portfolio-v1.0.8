name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Install browser for layout review
        run: |
          npm install --no-save --package-lock=false playwright pngjs
          npx playwright install --with-deps chromium
      - name: Check project layout in Chromium
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {chromium} from 'playwright';
          const server = spawn(process.execPath, ['node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','4173','--strictPort']);
          let browser;
          try {
            let ready = false;
            for (let i = 0; i < 100; i++) {
              try { ready = (await fetch('http://127.0.0.1:4173')).ok; } catch {}
              if (ready) break;
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            assert(ready, 'Preview server started');
            browser = await chromium.launch();
            const page = await browser.newPage({viewport:{width:1440,height:1000},reducedMotion:'reduce'});
            await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle'});
            await page.evaluate(() => document.fonts.ready);
            console.log('SAGE_PREVIEW_BASE64='+(await page.screenshot({type:'jpeg',quality:60})).toString('base64'));
            await page.locator('#projects').scrollIntoViewIfNeeded();
            await page.locator('.project-visual img').evaluateAll(images => Promise.all(images.map(img => img.decode())));
            const styles = await page.evaluate(() => {
              const card = document.querySelector('.project-card');
              const heading = document.querySelector('#projects h2');
              const root = getComputedStyle(document.documentElement);
              return {
                background:getComputedStyle(card).backgroundColor,
                panel:root.getPropertyValue('--panel').trim(),
                radius:getComputedStyle(card).borderRadius,
                headingFont:getComputedStyle(heading).fontFamily,
                display:root.getPropertyValue('--display').trim(),
                gradient:getComputedStyle(card).backgroundImage
              };
            });
            assert.equal(styles.radius, '0px');
            assert.equal(styles.gradient, 'none');
            assert.equal(styles.background, 'rgb(29, 29, 32)');
            assert(styles.headingFont.includes('Barlow Condensed'));
            async function inView() {
              return page.locator('#project-track').evaluate(track => {
                const box = track.getBoundingClientRect();
                return [...track.querySelectorAll('.project-card')].filter(card => {
                  const rect = card.getBoundingClientRect();
                  return !card.hidden && rect.right > box.left+2 && rect.left < box.right-2;
                }).length;
              });
            }
            assert.equal(await inView(), 2);
            await page.locator('.filter-chip[data-filter="Unity"]').click();
            assert.equal(await inView(), 1);
            assert(new URL(page.url()).searchParams.get('tag') === 'Unity');
            await page.locator('.filter-chip[data-filter=""]').click();
            assert.equal(await inView(), 2);
            await page.setViewportSize({width:390,height:844});
            await page.locator('#projects').scrollIntoViewIfNeeded();
            assert.equal(await inView(), 1);
            assert(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth));
            await page.locator('[data-carousel-next]').click();
            await page.waitForFunction(() => document.querySelector('[data-carousel-position]').textContent.includes('2–2'));
            assert.equal(await inView(), 1);
            console.log('PASS: desktop two-card layout, shared theme, filtering, mobile sizing and navigation.');
          } finally {
            await browser?.close();
            server.kill();
          }
          JS
      - name: Prepare matching accent icon pixels
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {PNG} from 'pngjs';
          const from = [228,119,134], to = [168,184,159];
          function recolor(data, stride=4, blueFirst=false) {
            for(let i=0;i<data.length;i+=stride) {
              const rIndex=i+(blueFirst?2:0), bIndex=i+(blueFirst?0:2);
              const blend=Math.max(0,Math.min(1,(data[rIndex]-data[i+1])/(from[0]-from[1])));
              if(!blend)continue;
              data[rIndex]=Math.round(data[rIndex]+blend*(to[0]-from[0]));
              data[i+1]=Math.round(data[i+1]+blend*(to[1]-from[1]));
              data[bIndex]=Math.round(data[bIndex]+blend*(to[2]-from[2]));
            }
          }
          function png(input) {
            const decoded=PNG.sync.read(input);
            recolor(decoded.data);
            return PNG.sync.write(decoded);
          }
          function ico(input) {
            assert.equal(input.readUInt16LE(2),1);
            const count=input.readUInt16LE(4), directory=Buffer.from(input.subarray(0,6+16*count));
            const frames=[];
            let offset=directory.length;
            for(let i=0;i<count;i++) {
              const entry=6+16*i, size=input.readUInt32LE(entry+8), start=input.readUInt32LE(entry+12);
              let frame=Buffer.from(input.subarray(start,start+size));
              if(frame.readUInt32BE(0)===0x89504e47) frame=png(frame);
              else {
                const header=frame.readUInt32LE(0), width=frame.readInt32LE(4), height=Math.abs(frame.readInt32LE(8))/2;
                assert.equal(frame.readUInt16LE(14),32,'ICO DIB depth');
                assert.equal(frame.readUInt32LE(16),0,'Uncompressed ICO DIB');
                recolor(frame.subarray(header,header+width*height*4),4,true);
              }
              directory.writeUInt32LE(frame.length,entry+8);
              directory.writeUInt32LE(offset,entry+12);
              offset+=frame.length;
              frames.push(frame);
            }
            return Buffer.concat([directory,...frames]);
          }
          for(const path of ['public/apple-touch-icon-keith-v109.png','public/favicon-keith-v109.ico','public/favicon.ico']) {
            const source=await readFile(path), output=path.endsWith('.ico')?ico(source):png(source);
            console.log('SAGE_ICON='+JSON.stringify({path,content:output.toString('base64')}));
          }
          JS
